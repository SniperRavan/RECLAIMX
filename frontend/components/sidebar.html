<!--
  components/sidebar.html
  NEW-H FIX: Removed the <style> block that was at the top of this file.
  Those styles (.sidebar-link.active inset shadow, .sidebar-link:active scale)
  are now permanently in assets/css/global.css where they belong.
  Injecting a <style> block into <body> via fetch() caused a Flash Of Unstyled
  Content (FOUC) — the sidebar would flicker on every page load as the injected
  styles applied after the initial render.
-->
