<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Browse Items — ReclaimX</title>
  <link rel="stylesheet" href="../assets/css/global.css"/>
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg"/>
  <link rel="manifest" href="../manifest.json"/>
  <style>
    .browse-tabs { display:flex; gap:6px; margin-bottom:20px; }
    .browse-tab { padding:9px 20px; border-radius:100px; font-size:0.82rem; font-weight:500; cursor:pointer; border:1px solid var(--border); background:transparent; color:var(--text-secondary); transition:all 0.2s; font-family:var(--font-body); }
    .browse-tab.active { background:var(--accent-dim); color:var(--accent); border-color:rgba(0,212,170,0.3); }
    .browse-tab:hover:not(.active) { background:var(--bg-elevated); color:var(--text-primary); }
    .items-count { font-size:0.72rem; font-family:var(--font-mono); color:var(--text-muted); margin-bottom:16px; }
    .empty-state { text-align:center; padding:64px 24px; }
    .empty-state h3 { font-size:1.1rem; color:var(--text-secondary); margin-bottom:8px; }
    .empty-state p { font-size:0.85rem; color:var(--text-muted); }
    select.form-select { -webkit-appearance: none; appearance: none; }
  </style>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-placeholder"></div>

  <main class="main-content">
    <header class="main-header">
      <button id="menuBtn" style="display:none;background:none;border:none;color:var(--text-primary);cursor:pointer;margin-right:12px;padding:4px;" onclick="document.getElementById('appSidebar').classList.add('open')">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>
      <div>
        <h1>Browse Items</h1>
        <p>All lost and found reports on your campus — only item names are visible publicly.</p>
      </div>
      <div style="display:flex;gap:10px">
        <a href="report-lost.html"  class="btn btn-ghost btn-sm">+ Lost</a>
        <a href="report-found.html" class="btn btn-primary btn-sm">+ Found</a>
      </div>
    </header>

    <div class="page-content">
      <div class="filter-bar">
        <div class="filter-search-wrap">
          <svg class="filter-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input class="form-input" type="text" id="searchInput" placeholder="Search by item name…"/>
        </div>
        <div style="position:relative">
          <select class="form-select" id="categoryFilter" style="width:160px;padding-right:32px;cursor:pointer">
            <option value="">All Categories</option>
            <option value="Accessories">Accessories</option>
            <option value="Bags">Bags</option>
            <option value="Documents">Documents</option>
            <option value="Electronics">Electronics</option>
            <option value="Clothing">Clothing</option>
            <option value="Keys">Keys</option>
            <option value="Books">Books</option>
            <option value="Other">Other</option>
          </select>
          <svg style="position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text-muted)" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </div>

        <div style="position:relative">
          <select class="form-select" id="campusFilter" style="width:160px;padding-right:32px;cursor:pointer">
            <option value="">All Campuses</option>
            <option value="campus_a">Campus A</option>
            <option value="campus_b">Campus B</option>
            <option value="campus_c">Campus C</option>
          </select>
          <svg style="position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text-muted)" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>

      <div class="browse-tabs">
        <button class="browse-tab active" onclick="setTab(this,'lost')">Lost Items</button>
        <button class="browse-tab" onclick="setTab(this,'found')">Found Items</button>
        <button class="browse-tab" onclick="setTab(this,'all')">All</button>
      </div>

      <div class="items-count" id="itemsCount">Loading…</div>

      <div class="items-grid" id="itemsGrid">
        <div style="text-align:center;padding:40px;color:var(--text-muted);grid-column:1/-1">
           <span class="loading-spinner"></span>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="toastContainer" class="toast-container" aria-live="polite"></div>

<script src="../assets/js/main.js"></script>
<script src="../assets/js/pwa.js"></script>
<script>
  fetch('../components/sidebar.html').then(r=>r.text()).then(html=>{ document.getElementById('sidebar-placeholder').innerHTML=html; });

  const ICON_MAP = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:2px;opacity:0.7"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>';
  const ICON_TAG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:2px;opacity:0.7"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></svg>';
  
  const CATEGORY_ICONS = {
    Accessories: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7"/><polyline points="12 9 12 12 13.5 13.5"/></svg>',
    Bags: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>',
    Documents: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="14" x="3" y="5" rx="2" ry="2"/><path d="M7 15h4"/><path d="M7 11h.01"/><path d="M11 11h6"/><path d="M15 15h2"/></svg>',
    Electronics: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>',
    Clothing: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.38 3.46 16 2a8.16 8.16 0 0 0-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>',
    Keys: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"/><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/></svg>',
    Books: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>',
    Other: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>'
  };

  let allItems = { lost: [], found: [] };
  let activeTab = 'lost';

  const API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:5000' : 'https://YOUR-RAILWAY-URL.up.railway.app';

  async function loadItems() {
    try {
      const params = new URLSearchParams();
      const cat    = document.getElementById('categoryFilter').value;
      const campus = document.getElementById('campusFilter').value;
      if (cat)    params.set('category', cat);
      if (campus) params.set('campus', campus);

      const res  = await fetch(`${API_BASE}/api/items?${params}`);
      const data = await res.json();
      allItems = data;
      renderItems();
    } catch {
      document.getElementById('itemsCount').textContent = 'Cannot connect to server.';
      document.getElementById('itemsGrid').innerHTML = '<div style="text-align:center;padding:40px;color:var(--danger);grid-column:1/-1">Failed to load items.</div>';
    }
  }

  function renderItems() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    let items = activeTab === 'lost'  ? allItems.lost  :
                activeTab === 'found' ? allItems.found :
                [...(allItems.lost||[]), ...(allItems.found||[])];

    if (search) items = items.filter(i => (i.item_name||'').toLowerCase().includes(search));

    document.getElementById('itemsCount').textContent = `${items.length} item${items.length !== 1 ? 's' : ''} found`;

    if (!items.length) {
      document.getElementById('itemsGrid').innerHTML = `
        <div class="empty-state" style="grid-column:1/-1">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5" style="margin-bottom:16px"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <h3>No items found</h3>
          <p>Try different filters or be the first to report one.</p>
        </div>`;
      return;
    }

    document.getElementById('itemsGrid').innerHTML = items.map((item, i) => {
      const isLost   = item.status === 'Lost';
      const location = item.last_seen_location || item.found_location || '—';
      const icon     = CATEGORY_ICONS[item.category] || CATEGORY_ICONS['Other'];
      const ago      = window.ReclaimX?.timeAgo(item.createdAt) || 'Recently';
      return `
        <div class="item-card" style="animation:fadeUp 0.4s ${i*0.05}s ease both">
          <div class="item-card-thumb" style="color:var(--text-secondary)">${icon}</div>
          <div class="item-card-body">
            <div class="item-card-name">${item.item_name}</div>
            <div class="item-card-meta">
              <span>${ICON_MAP} ${location}</span>
              <span>${ICON_TAG} ${item.category}</span>
            </div>
          </div>
          <div class="item-card-footer">
            <span class="badge ${isLost ? 'badge-danger' : 'badge-accent'}">${item.status}</span>
            <span style="font-family:var(--font-mono)">${ago}</span>
          </div>
        </div>`;
    }).join('');
  }

  function setTab(btn, tab) {
    document.querySelectorAll('.browse-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    activeTab = tab;
    renderItems();
  }

  let debounce;
  ['searchInput','categoryFilter','campusFilter'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      clearTimeout(debounce);
      debounce = setTimeout(loadItems, 300);
    });
  });

  loadItems();
</script>
</body>
</html>
