<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
  <title>My Matches — ReclaimX</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/global.css"/>
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg"/>
  <style>
    .stats-strip { display:flex; border-bottom:1px solid var(--border); background:var(--bg-surface); }
    .stat-strip-item { flex:1; padding:16px 24px; text-align:center; border-right:1px solid var(--border); }
    .stat-strip-item:last-child { border-right:none; }
    .stat-strip-num { font-family:var(--font-display); font-size:1.5rem; font-weight:800; letter-spacing:-0.5px; }
    .stat-strip-label { font-size:0.68rem; font-family:var(--font-mono); color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; margin-top:2px; }
    .match-tabs { display:flex; gap:6px; border-bottom:1px solid var(--border); margin-bottom:24px; padding:0 36px; }
    .match-tab { padding:10px 18px; font-size:0.82rem; font-weight:500; color:var(--text-secondary); border:none; background:none; cursor:pointer; border-bottom:2px solid transparent; transition:all 0.2s; font-family:var(--font-body); }
    .match-tab:hover { color:var(--text-primary); }
    .match-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
    .tab-count { display:inline-flex; align-items:center; justify-content:center; background:var(--accent-dim); color:var(--accent); border-radius:100px; font-size:0.62rem; font-family:var(--font-mono); min-width:18px; height:18px; padding:0 5px; margin-left:6px; }
    .match-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; transition:all 0.25s; margin-bottom:16px; }
    .match-card:hover { border-color:var(--border-hover); }
    .match-card.high-confidence { border-top:2px solid var(--accent); }
    .match-card-header { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:14px; }
    .match-icon { width:44px; height:44px; border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--bg-elevated); border:1px solid var(--border); color:var(--accent); font-size:1.4rem; }
    .match-header-info { flex:1; }
    .match-item-name { font-size:1rem; font-weight:600; }
    .match-meta { font-size:0.75rem; color:var(--text-muted); margin-top:2px; display:flex; gap:12px; flex-wrap:wrap; }
    .score-dial { display:flex; flex-direction:column; align-items:center; flex-shrink:0; }
    .score-ring { width:52px; height:52px; border-radius:50%; background:conic-gradient(var(--accent) calc(var(--pct) * 1%), var(--bg-elevated) 0); display:flex; align-items:center; justify-content:center; position:relative; }
    .score-ring::before { content:''; position:absolute; inset:6px; border-radius:50%; background:var(--bg-card); }
    .score-num { position:relative; z-index:2; font-family:var(--font-display); font-size:0.8rem; font-weight:800; }
    .score-label { font-size:0.6rem; font-family:var(--font-mono); color:var(--text-muted); margin-top:4px; text-transform:uppercase; }
    .match-card-body { padding:14px 20px; font-size:0.82rem; color:var(--text-secondary); line-height:1.6; }
    .match-card-footer { padding:14px 20px; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; background:rgba(0,0,0,0.15); }
    .match-actions { display:flex; gap:8px; }
    .resolved-banner { background:rgba(0,212,170,0.08); border-top:1px solid rgba(0,212,170,0.15); padding:10px 20px; font-size:0.78rem; color:var(--accent); display:flex; align-items:center; gap:8px; }
    .matches-content { padding:0 36px 36px; }
    @media(max-width:900px) {
      .main-content { margin-left:0; }
      .match-tabs, .matches-content { padding-left:16px; padding-right:16px; }
      .stats-strip { flex-wrap:wrap; }
      .stat-strip-item { flex:1 1 50%; }
    }
  </style>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-placeholder"></div>

  <main class="main-content">
    <header class="main-header">
      <button id="menuBtn" style="display:none;background:none;border:none;color:var(--text-primary);cursor:pointer;margin-right:12px;padding:4px;"
        onclick="const s=document.getElementById('appSidebar');if(s)s.classList.add('open');">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div>
        <h1>My Matches <span class="ai-badge"><span class="ai-dot"></span>Scoring Engine</span></h1>
        <p>Items matched to your reports — review and verify your claims below.</p>
      </div>
      <a href="browse.html" class="btn btn-ghost btn-sm">Browse All Items</a>
    </header>

    <div class="stats-strip">
      <div class="stat-strip-item"><div class="stat-strip-num text-accent" id="sNew">—</div><div class="stat-strip-label">New Matches</div></div>
      <div class="stat-strip-item"><div class="stat-strip-num" style="color:var(--warning)" id="sPending">—</div><div class="stat-strip-label">Pending Handover</div></div>
      <div class="stat-strip-item"><div class="stat-strip-num" style="color:var(--text-secondary)" id="sResolved">—</div><div class="stat-strip-label">Resolved</div></div>
      <div class="stat-strip-item"><div class="stat-strip-num text-muted" id="sDismissed">—</div><div class="stat-strip-label">Dismissed</div></div>
    </div>

    <div class="match-tabs">
      <button class="match-tab active" onclick="setTab(this,'new')">New<span class="tab-count" id="tabNew">0</span></button>
      <button class="match-tab" onclick="setTab(this,'pending')">Pending<span class="tab-count" id="tabPending">0</span></button>
      <button class="match-tab" onclick="setTab(this,'resolved')">Resolved<span class="tab-count" id="tabResolved">0</span></button>
      <button class="match-tab" onclick="setTab(this,'dismissed')">Dismissed</button>
    </div>

    <div class="matches-content">
      <div id="matchesContainer">
        <div style="text-align:center;padding:40px;color:var(--text-muted)">
          <span class="loading-spinner"></span>
          <div style="margin-top:12px;font-size:0.85rem">Loading matches…</div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="/assets/js/auth-guard.js"></script>
<script src="/assets/js/main.js"></script>
<script src="/assets/js/pwa.js"></script>
<script>
  fetch('../components/sidebar.html').then(r => r.text()).then(html => { document.getElementById('sidebar-placeholder').innerHTML = html; });

  const CATEGORY_ICONS = {
    Accessories: '<i class="fa-solid fa-gem"></i>',
    Bags:        '<i class="fa-solid fa-bag-shopping"></i>',
    Documents:   '<i class="fa-solid fa-id-card"></i>',
    Electronics: '<i class="fa-solid fa-laptop-code"></i>',
    Clothing:    '<i class="fa-solid fa-shirt"></i>',
    Keys:        '<i class="fa-solid fa-key"></i>',
    Books:       '<i class="fa-solid fa-book-open"></i>',
    Other:       '<i class="fa-solid fa-box-open"></i>'
  };

  const ICON_MAP = '<i class="fa-solid fa-location-dot" style="font-size:10px; opacity:0.7; margin-right:4px;"></i>';

  function setTab(btn, tab) {
    document.querySelectorAll('.match-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.match-card').forEach(c => {
      c.style.display = c.dataset.tab === tab ? '' : 'none';
    });
  }

  async function loadMatches() {
    try {
      const token = await window.getToken();
      const res = await fetch(`${window.API_BASE}/api/matches`, { headers: { 'Authorization': `Bearer ${token}` } });
      if (!res.ok) throw new Error(`Matches Error: ${res.status}`);
      const claims = await res.json();

      const counts = { new: 0, pending: 0, resolved: 0, dismissed: 0 };
      const html = claims.map(c => {
        let tab = 'new';
        if (c.status === 'Verified')  tab = 'pending';
        if (c.status === 'Resolved')  tab = 'resolved';
        if (c.status === 'Rejected')  tab = 'dismissed';
        counts[tab]++;

        const lost  = c.lost_items  || {};
        const found = c.found_items || {};
        const icon  = CATEGORY_ICONS[lost.category] || CATEGORY_ICONS['Other'];
        const isHigh = c.match_score > 80;

        return `
          <div class="match-card ${isHigh ? 'high-confidence' : ''}" data-tab="${tab}" style="display:${tab === 'new' ? '' : 'none'}">
            <div class="match-card-header">
              <div class="match-icon">${icon}</div>
              <div class="match-header-info">
                <div class="match-item-name">${lost.item_name}</div>
                <div class="match-meta">
                  <span>${ICON_MAP} Found: ${found.found_location || '—'}</span>
                  <span><i class="fa-solid fa-clock" style="font-size:10px; margin-right:4px;"></i> ${window.ReclaimX?.timeAgo(c.created_at)}</span>
                </div>
              </div>
              <div class="score-dial">
                <div class="score-ring" style="--pct:${c.match_score}">
                  <span class="score-num text-accent">${Math.round(c.match_score)}%</span>
                </div>
                <div class="score-label">Confidence</div>
              </div>
            </div>
            <div class="match-card-body">
              Lost at: ${lost.last_seen_location || '—'} · Found at: ${found.found_location || '—'}
            </div>
            <div class="match-card-footer">
              <div style="font-size:0.75rem;color:var(--text-muted)">Status: ${c.status}</div>
              ${tab === 'new' ? `<button class="btn btn-primary btn-sm" onclick="openVerify('${c.id}')">Verify Claim</button>` : ''}
            </div>
          </div>`;
      }).join('');

      document.getElementById('matchesContainer').innerHTML = html || `<div style="text-align:center;padding:60px;opacity:0.5;"><i class="fa-solid fa-magnifying-glass" style="font-size:3rem; margin-bottom:16px;"></i><div>No matches found yet.</div></div>`;

      // Update counters
      ['New','Pending','Resolved','Dismissed'].forEach(t => {
        const el = document.getElementById('s'+t);
        if(el) el.textContent = counts[t.toLowerCase()];
        const tabEl = document.getElementById('tab'+t);
        if(tabEl) tabEl.textContent = counts[t.toLowerCase()];
      });

    } catch (err) {
      // ── "UNPLUGGED CORD" ERROR STATE ──
      document.getElementById('matchesContainer').innerHTML = `
        <div style="text-align:center;padding:60px 20px;display:flex;flex-direction:column;align-items:center;">
          <div style="width:80px;height:80px;margin-bottom:24px;">
              <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted); width: 100%; height: 100%;">
                <rect x="8" y="20" width="16" height="24" rx="4" fill="var(--bg-elevated)"/>
                <line x1="24" y1="26" x2="30" y2="26" stroke="var(--accent)" stroke-width="4"/>
                <line x1="24" y1="38" x2="30" y2="38" stroke="var(--accent)" stroke-width="4"/>
                <rect x="40" y="16" width="16" height="32" rx="4" fill="var(--bg-elevated)"/>
                <circle cx="46" cy="26" r="2" fill="var(--bg-card)"/>
                <circle cx="46" cy="38" r="2" fill="var(--bg-card)"/>
                <line x1="33" y1="20" x2="37" y2="16" stroke="var(--violet)"/>
                <line x1="33" y1="44" x2="37" y2="48" stroke="var(--violet)"/>
              </svg>
          </div>
          <h3 style="font-size:1.2rem;margin-bottom:8px;">Connection Lost</h3>
          <p style="font-size:0.85rem;color:var(--text-secondary);">Check your connection or start your backend.</p>
        </div>`;
    }
  }

  window.addEventListener('load', loadMatches);
</script>
</body>
</html>
